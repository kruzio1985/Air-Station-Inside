; ==============================================================================
; FilamentMonitor - monitor powietrza i wilgotnosci filamentu przy drukarce 3D
; Master: ESP32-S3 WROOM-1 N16R8 (osobna plytka, niezalezna od stacji pogody)
; Copyright (c) 2026 kruzio1985
; ==============================================================================
;
;  Sprzet mastera (etap 1):
;   - PMS7003          UART2 (RX=18, TX=17), 9600 b/s
;   - Waveshare TVOC   UART1 (RX=14, TX=15), 115200 b/s  (SKU 30712)
;   - ADS1115          I2C  (SDA=8, SCL=9), 0x48 -> MiCS5524 (AIN0, 5 V bez dzielnika)
;   - karta microSD    SPI   (SCK=4, MOSI=5, MISO=6, CS=2)
;   - pasek LED RGBIC  GPIO 7 (dane)
;   - PIR / LD2410     GPIO 21 (ruch lokalny, przerwanie)
;
;  UWAGA - PSRAM na N16R8 dziala tylko gdy ustawione sa OBIE rzeczy:
;   1) board_build.arduino.memory_type = qio_opi
;   2) -DBOARD_HAS_PSRAM w build_flags
;  (patrz opis w projekcie StacjaPogody)
; ==============================================================================

[env:esp32s3]
platform = espressif32 @ ^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Flash 16 MB ---
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- PSRAM 8 MB octal + flash QIO ---
board_build.arduino.memory_type = qio_opi

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    mathieucarbou/ESPAsyncWebServer
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit ADS1X15 @ ^2.4.0
    adafruit/Adafruit BusIO @ ^1.16.0
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    fastled/FastLED @ 3.6.0
    beegee-tokyo/DHT sensor library for ESPx

; Konsola: UART0 (mostek FTDI/CP2102 -> port COMxx).
; UWAGA: bez CDC_ON_BOOT Serial idzie na UART0 (GPIO43/44), wiec logi
; sa widoczne na porcie mostka USB-UART (jak fabryczne demo "led_strip").
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

; ------------------------------------------------------------------------------
; Aktualizacja przez Wi-Fi (OTA) - haslo ustawia sie na stronie www
;   pio run -e esp32s3-ota -t upload --upload-port <IP>
; ------------------------------------------------------------------------------
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = filament-monitor.local
upload_flags =
    --auth=changeme
